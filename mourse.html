<html>

<style>
body{
    background-image:url(photo_2026-08-14_17-09-04.jpg );
    background-repeat: no-repeat;
 background-size: cover;
 overflow-x: hidden;
 background-attachment: fixed;
}
.categories {
    display: flex;
    justify-content: center;

    width: 220px;

}

.categories button:hover {

}
#courses {
    width: 80%;
    margin: 30px auto;
    padding: 25px;

    border-radius: 20px;

    background-color: rgba(255,255,255,0.85);

}

    width: 100%;

}

    text-align: center;
    display: block;
}

</head>
<body>

</div>
</div>
<div id="courses"></div>

    let courses = document.getElementById("courses");

    if (courses.innerHTML != "") {
        courses.innerHTML = "";
        return;
    }
if (type == "order") {
    courses.innerHTML = `
